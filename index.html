function creerRechercheReference(){

    const container =
    document.createElement("div");

    const input =
    document.createElement("input");

    input.placeholder =
    "Rechercher une référence";

    const liste =
    document.createElement("div");

    liste.style.border =
    "1px solid #ccc";

    liste.style.maxHeight =
    "150px";

    liste.style.overflowY =
    "auto";

    liste.style.display =
    "none";

    const valeurChoisie =
    document.createElement("div");

	valeurChoisie.dataset.reference = "";

	valeurChoisie.innerHTML =
	"<i>Aucune référence sélectionnée</i>";

    input.addEventListener(
        "input",
        ()=>{

            const filtre =
            input.value
            .toLowerCase();

            liste.innerHTML = "";

            const resultats =
            references.filter(r=>

                r.nom
                .toLowerCase()
                .includes(filtre)

            );

            liste.style.display =
            resultats.length
            ? "block"
            : "none";

            resultats.forEach(ref=>{

                const ligne =
                document.createElement("div");

                ligne.style.padding =
                "5px";

                ligne.style.cursor =
                "pointer";

                ligne.textContent =
                ref.nom;

                ligne.addEventListener(
                    "click",
                    ()=>{

                        valeurChoisie.dataset.reference =
                        ref.nom;

                        valeurChoisie.innerHTML =
                        `<b>${ref.nom}</b>`;

                        input.value =
                        "";

                        liste.style.display =
                        "none";

                        calculer();

                    }
                );

                liste.appendChild(
                    ligne
                );

            });

        }
    );

    container.appendChild(input);
    container.appendChild(liste);
    container.appendChild(valeurChoisie);

    return container;

}

function ajouterLigne(){

    const line =
    document.createElement("div");

    line.className =
    "reference-line";

    const select =
    creerRechercheReference();

    const quantite =
    document.createElement(
        "input"
    );

    quantite.type =
    "number";

    quantite.min = 0;

    quantite.value = 0;

    const volumeInfo =
    document.createElement(
        "div"
    );

    const sousTotalInfo =
    document.createElement(
        "div"
    );

    const boutonSupprimer =
    document.createElement(
        "button"
    );

    boutonSupprimer.textContent =
    "🗑 Supprimer";

    boutonSupprimer.className =
    "action-btn";

    boutonSupprimer.addEventListener(
    "click",
    ()=>{

        line.remove();

        calculer();

    });

    select.addEventListener(
    "change",
    calculer
    );

    quantite.addEventListener(
    "input",
    calculer
    );

    line.appendChild(select);
    line.appendChild(quantite);
    line.appendChild(volumeInfo);
    line.appendChild(sousTotalInfo);
    line.appendChild(boutonSupprimer);

    line._volumeInfo =
    volumeInfo;

    line._sousTotalInfo =
    sousTotalInfo;

    document
    .getElementById(
        "referenceLines"
    )
    .appendChild(line);

    calculer();

}

/* =====================================================
   CALCULS JESMONITE
===================================================== */

function calculer(){

    let volumeTotal = 0;
    let piecesTotales = 0;

    document
    .querySelectorAll(
        "#referenceLines .reference-line"
    )
    .forEach(line=>{

const refElement =
line.querySelector(
    "[data-reference]"
);

if(!refElement){

    line._volumeInfo.innerHTML =
    "Volume unitaire : <b>0 ml</b>";

    line._sousTotalInfo.innerHTML =
    "Sous-total : <b>0 ml</b>";

    return;
}

const nom =
refElement.dataset.reference;

const qte =
Number(
    line.querySelector(
        "input[type='number']"
    ).value
) || 0;

const ref =
references.find(
    r => r.nom === nom
);

if(!ref){

    line._volumeInfo.innerHTML =
    "Volume unitaire : <b>0 ml</b>";

    line._sousTotalInfo.innerHTML =
    "Sous-total : <b>0 ml</b>";

    return;
}

        const sousTotal =
		Number(ref.volume) *
		Number(qte);

        volumeTotal +=
        sousTotal;

		piecesTotales +=

		qte *

		(ref.nbPieces || 1);

        line._volumeInfo.innerHTML =
        `
        Volume unitaire :
        <b>${ref.volume} ml</b>
        `;

        line._sousTotalInfo.innerHTML =
        `
        Sous-total :
        <b>${sousTotal} ml</b>
        `;

    });

    const majoration =
    Number(
        document
        .getElementById(
            "majoration"
        )
        .value
    ) || 0;

    const colorantPct =
    Number(
        document
        .getElementById(
            "colorantPct"
        )
        .value
    ) || 0;

    const retardatairePct =
    Number(
        document
        .getElementById(
            "retardatairePct"
        )
        .value
    ) || 0;

    const liquideBase =
    volumeTotal / 2;

    const poudreBase =
    liquideBase * 2.5;

    const masseTheorique =
    liquideBase +
    poudreBase;

    const liquide =
    Math.ceil(
        liquideBase *
        (
            1 +
            (
                majoration / 100
            )
        )
    );

    const poudre =
    Math.floor(
        masseTheorique -
        liquide
    );

    const colorant =
    Number(
        (
            (
                liquide +
                poudre
            )
            *
            colorantPct
            / 100
        )
        .toFixed(1)
    );

    const retardataire =
    Number(
        (
            (
                liquide +
                colorant
            )
            *
            retardatairePct
            / 100
        )
        .toFixed(1)
    );

    document
    .getElementById(
        "nbPieces"
    )
    .textContent =
    piecesTotales;

    document
    .getElementById(
        "volumeTotal"
    )
    .textContent =
    volumeTotal;

    document
    .getElementById(
        "liquide"
    )
    .textContent =
    liquide;

    document
    .getElementById(
        "poudre"
    )
    .textContent =
    poudre;

    document
    .getElementById(
        "colorant"
    )
    .textContent =
    colorant;

    document
    .getElementById(
        "retardataire"
    )
    .textContent =
    retardataire;

}

function(index){

    const detail =

        ".fleche"
    );

    if(
        detail.style.display ===
        "none"
    ){

        detail.style.display =
        "block";

        fleche.textContent =
        "▼";

    }
    else{

        detail.style.display =
        "none";

        fleche.textContent =
        "▶";

    }

function ajouterReference(){

    const nom =
    document
    .getElementById(
        "newRefName"
    )
    .value
    .trim();

    const volume =
    Number(
        document
        .getElementById(
            "newRefVolume"
        )
        .value
    );

    if(!nom){

        alert(
            "Veuillez saisir un nom"
        );

        return;
    }

    if(volume <= 0){

        alert(
            "Veuillez saisir un volume valide"
        );

        return;
    }

    const existe =
    references.some(r =>

        r.nom
        .toLowerCase()
        ===
        nom.toLowerCase()

    );

    if(existe){

        alert(
            "Cette référence existe déjà"
        );

        return;
    }

	references.push({

		nom: nom,

		volume: volume,

		nbPieces:

		Number(

			document
			.getElementById(
				"newRefNbPieces"
			)
			.value

		) || 1

	});

    saveReferences();

    document
    .getElementById(
        "newRefName"
    )
    .value = "";

    document
    .getElementById(
        "newRefVolume"
    )
    .value = "";

    renderReferences();

    refreshAllProductionLists();

}

/* =====================================================
   RECHERCHE + TRI
===================================================== */

function renderReferences(){

    const filtre =

    document
    .getElementById(
        "refSearch"
    )
    .value
    .toLowerCase()
    .trim();

    const tri =

    document
    .getElementById(
        "refSort"
    )
    .value;

    let refsAffichage =
    [...references];

    switch(tri){

        case "za":

            refsAffichage.sort(
                (a,b)=>
                b.nom.localeCompare(
                    a.nom
                )
            );

            break;

        case "volumeAsc":

            refsAffichage.sort(
                (a,b)=>
                a.volume - b.volume
            );

            break;

        case "volumeDesc":

            refsAffichage.sort(
                (a,b)=>
                b.volume - a.volume
            );

            break;

        default:

            refsAffichage.sort(
                (a,b)=>
                a.nom.localeCompare(
                    b.nom
                )
            );

    }

    refsAffichage =
    refsAffichage.filter(ref=>

        ref.nom
        .toLowerCase()
        .includes(filtre)

    );

    const container =
    document.getElementById(
        "referencesContainer"
    );

    container.innerHTML = "";

    refsAffichage.forEach(ref=>{

        const index =
        references.findIndex(
            r =>

            r.nom === ref.nom
            &&
            r.volume === ref.volume
        );

        const card =
        document.createElement(
            "div"
        );

        card.className =
        "card";

card.innerHTML =

`
<h3>
${ref.nom}
</h3>

<div>
Volume :
<b>${ref.volume} ml</b>
</div>

<div>
Pièces :
<b>${ref.nbPieces || 1}</b>
</div>

<br>

        <button
        class="action-btn"
        onclick="modifierReference(${index})">

        ✏ Modifier

        </button>

        <button
        class="action-btn"
        onclick="supprimerReference(${index})">

        🗑 Supprimer

        </button>
        `;

        container.appendChild(
            card
        );

    });

    document
    .getElementById(
        "refCounter"
    )
    .textContent =

    `${refsAffichage.length}
    référence(s) trouvée(s)`;

}

    const nouveauNom =

    if(

    ){
        return;
    }

    const nouveauVolume =
    prompt(
        "Volume",
        ref.volume
    );

    if(
        nouveauVolume === null
    ){
        return;
    }

    const nouveauNbPieces =
    prompt(
        "Nombre de pièces",
        ref.nbPieces || 1
    );

    if(
        nouveauNbPieces === null
    ){
        return;
    }

    ref.nom =
    nouveauNom.trim();

    ref.volume =
    Number(
        nouveauVolume
    );

    ref.nbPieces =
    Number(
        nouveauNbPieces
    ) || 1;

    saveReferences();

    renderReferences();

    refreshAllProductionLists();

};

function importerDonnees(event){

    const fichier =
    event.target.files[0];

    if(!fichier){

        return;

    }

    const reader =
    new FileReader();

    reader.onload =
    function(e){

        try{

            const data =
            JSON.parse(
                e.target.result
            );

            if(
                !data.references
                ||
                !data.lots
            ){

                throw new Error(
                    "Format invalide"
                );

            }

            references =
            data.references;

            saveReferences();

            saveLots(
                data.lots
            );

            renderReferences();

            renderHistorique();

            refreshAllProductionLists();

            alert(

                "Import terminé avec succès"

            );

        }
        catch(error){

            alert(

                "Fichier invalide"

            );

        }

    };

    reader.readAsText(
        fichier
    );

}

function calculerStatistiques(){

const lots =

getLots().filter(

    lot =>

    lot.statut !==
    "Annule"

);

const nbLotsAnnules =

getLots().filter(

    lot =>

    lot.statut ===
    "Annule"

).length;

    return {

        nbLots :

        lots.length,
		
		nbLotsAnnules :

		nbLotsAnnules,

        nbPieces :

        lots.reduce(

            (total, lot)=>

                total +
                Number(
                    lot.pieces || 0
                ),

            0

        ),

        volumeTotal :

        lots.reduce(

            (total, lot)=>

                total +
                Number(
                    lot.volume || 0
                ),

            0

        ),

        liquideTotal :

        Number(

    lots.reduce(

        (total, lot)=>

            total +
            Number(
                lot.liquide || 0
            ),

        0

    ).toFixed(1)

),

        poudreTotal :

        Number(

    lots.reduce(

        (total, lot)=>

            total +
            Number(
                lot.poudre || 0
            ),

        0

    ).toFixed(1)

),

        colorantTotal :

       Number(

    lots.reduce(

        (total, lot)=>

            total +
            Number(
                lot.colorant || 0
            ),

        0

    ).toFixed(1)

),

retardataireTotal :

Number(

    lots.reduce(

        (total, lot)=>

            total +
            Number(
                lot.retardataire || 0
            ),

        0

    ).toFixed(1)

),

    };

}

        "Les références ont été supprimées. Recharge maintenant la page."
    );

}
document
.getElementById("btnResetRefs")
.addEventListener(
    "click",
    rechargerReferencesParDefaut
);

function viderProduction(){

    if(
        !confirm(
            "Supprimer toutes les références de la production ?"
        )
    ){
        return;
    }

    document
    .getElementById(
        "referenceLines"
    )
    .innerHTML = "";

    calculer();

}

window.changerStatut =
function(index){

    const lots =
    getLots();

    const select =
    document
    .getElementById(
        `statut-${index}`
    );

    lots[index].statut =
    select.value;

    saveLots(lots);

    select.style.background =

    select.value ===
    "Annule"

    ?

    "#fee2e2"

    :

    "#dcfce7";

    afficherStatsSauvegarde();

};

document
.getElementById(
    "btnExportReferences"
)
.addEventListener(
    "click",
    exporterReferences
);

document
.getElementById(
    "btnImportReferences"
)
.addEventListener(
    "click",
    importerReferences
);

function exporterReferences(){

    const contenu =

    JSON.stringify(
        references,
        null,
        2
    );

    const blob =
    new Blob(

        [contenu],

        {
            type:
            "application/json"
        }

    );

    const lien =
    document.createElement(
        "a"
    );

    lien.href =

    URL.createObjectURL(
        blob
    );

    lien.download =

    "references.json";

    lien.click();

}

const fichierReferences =
document.createElement(
    "input"
);

fichierReferences.type =
"file";

fichierReferences.accept =
".json";

fichierReferences.style.display =
"none";

document.body.appendChild(
    fichierReferences
);

function importerReferences(){

    fichierReferences.click();

}

fichierReferences.addEventListener(

    "change",

    function(event){

        const fichier =

        event.target.files[0];

        if(!fichier){

            return;

        }

        const reader =
        new FileReader();

        reader.onload =

        function(e){

            try{

                const data =

                JSON.parse(
                    e.target.result
                );

                if(
                    !Array.isArray(
                        data
                    )
                ){

                    throw new Error();

                }

                references = data;

                saveReferences();

                renderReferences();

                refreshAllProductionLists();

                alert(

                    "Références importées avec succès"

                );

            }
            catch{

                alert(

                    "Fichier de références invalide"

                );

            }

        };

        reader.readAsText(
            fichier
        );

    }

);

const STORAGE_STATS_DATE =
"jesmonite_stats_date";

function getStatsStartDate(){

    return localStorage.getItem(
        STORAGE_STATS_DATE
    );

}

function setStatsStartDate(){

    const aujourdHui =

    new Date()
    .toISOString();

    localStorage.setItem(

        STORAGE_STATS_DATE,

        aujourdHui

    );

}

if(
    !getStatsStartDate()
){

    setStatsStartDate();

}
